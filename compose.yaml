services:
  openproject:
    image: openproject/openproject:17
    restart: unless-stopped
    expose:
      - "80"
    environment:
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}"
      OPENPROJECT_HOST__NAME: "${OPENPROJECT_HOST_NAME:-localhost:8080}"
      OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-false}"
      OPENPROJECT_DEFAULT__LANGUAGE: "${OPENPROJECT_DEFAULT_LANGUAGE:-ja}"
      OPENPROJECT_EE__HIDE__BANNERS: "true"
      OPENPROJECT_EE__MANAGER__VISIBLE: "false"
    volumes:
      - openproject_pgdata:/var/openproject/pgdata
      - openproject_assets:/var/openproject/assets
      - ./data/baselines:/app/tmp/pj-baselines
      - ./infra/openproject:/opt/openproject-patches:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        tr -d '\r' < /opt/openproject-patches/patch-plan-comparison.sh > /tmp/patch-plan-comparison.sh
        sh /tmp/patch-plan-comparison.sh
        exec /app/docker/prod/entrypoint.sh "$@"
      - openproject-entrypoint
    command: ["./docker/prod/supervisord"]

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - openproject
      - baseline-api
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/gantt-theme.css:/usr/share/nginx/html/custom/gantt-theme.css:ro
      - ./infra/nginx/baseline:/usr/share/nginx/html/baseline:ro
      - ./data/baselines:/usr/share/nginx/html/baseline-data:ro

  baseline-api:
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python3", "/opt/pj-baseline/server.py"]
    environment:
      BASELINE_DATA_DIR: /data
    volumes:
      - ./infra/baseline-api/server.py:/opt/pj-baseline/server.py:ro
      - ./data/baselines:/data

volumes:
  openproject_pgdata:
  openproject_assets:
