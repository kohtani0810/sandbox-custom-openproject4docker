server {
    listen 80;
    server_name _;

    location = /custom/gantt-theme.css {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location /baseline/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /baseline/index.html;
        add_header Cache-Control "no-cache";
    }

    location /baseline-data/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location /baseline-api/ {
        proxy_pass http://baseline-api:8090/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }

    location / {
        proxy_pass http://openproject:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep HTML editable so the local visual override can be injected.
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/custom/gantt-theme.css"><script src="/baseline/baseline-link.js?v=20260603-plan-button" defer></script></head>';
    }
}
